apiVersion: skaffold/v4beta6
kind: Config
deploy:
  statusCheckDeadlineSeconds: 420
  helm:
    # The database seed runs as a post-install hook helm waits for; the default 5m timeout is too
    # tight for the seed import.
    flags:
      install: ["--timeout", "15m0s"]
      upgrade: ["--timeout", "15m0s"]
    releases:
      - name: dhis2
        namespace: dhis2
        createNamespace: true
        chartPath: charts/dhis2
        valuesFiles:
          - ./tests/seed.yaml
          - ./values/dhis2.yaml
        setValueTemplates:
          ingress:
            enabled: true
            hostname: dhis2.im-feat.dhis2.org
            path: /dhis2
            certIssuer: cert-issuer-prod
          startupProbe:
            path: /dhis2
          livenessProbe:
            path: /dhis2
          readinessProbe:
            path: /dhis2
          contextPath: /dhis2
          image:
            repository: dhis2/core-dev
            tag: 2.42
            pullPolicy: Always
