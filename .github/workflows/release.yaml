name: Release Charts

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.8.1

      - name: Build chart dependencies
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add selectdb https://charts.selectdb.com
          helm dependency build charts/dhis2

      - name: Install chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        with:
          install_only: true

      - name: Publish chart release
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cr package charts/dhis2 --config cr.yaml
          cr upload --config cr.yaml --owner "$GITHUB_REPOSITORY_OWNER" --git-repo "${GITHUB_REPOSITORY#*/}" --commit "$GITHUB_SHA"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build documentation
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Generate index from published charts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p .index-packages
          helm repo index .index-packages
          mv .index-packages/index.yaml _site/index.yaml
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false) | .assets[] | select(.name | endswith(".tgz")) | .browser_download_url' |
            while IFS= read -r url; do
              package=".index-packages/${url##*/}"
              curl --fail --silent --show-error --location --output "$package" "$url"
              helm repo index .index-packages --url "${url%/*}" --merge _site/index.yaml
              mv .index-packages/index.yaml _site/index.yaml
              rm "$package"
            done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
