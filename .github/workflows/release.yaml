name: Release Charts

on:
  push:
    branches:
      - master

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.8.1

      - name: Build chart dependencies
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add selectdb https://charts.selectdb.com
          helm dependency build charts/dhis2

      - name: Run chart-releaser
        id: charts
        uses: helm/chart-releaser-action@v1.7.0
        with:
          config: cr.yaml
          # In v1.7.0 this skips the index push; release assets are still uploaded.
          skip_upload: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Generate chart index
        if: steps.charts.outputs.changed_charts != ''
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cr index --config cr.yaml --owner "$GITHUB_REPOSITORY_OWNER" --git-repo "${GITHUB_REPOSITORY#*/}"

      - name: Publish signed index and rebuild Pages
        if: steps.charts.outputs.changed_charts != ''
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const path = '.cr-index/index.yaml';
            if (!fs.existsSync(path)) {
              core.info('Chart index is already up to date.');
              return;
            }
            const contents = fs.readFileSync(path);
            if (contents.equals(fs.readFileSync('index.yaml'))) return;
            await github.graphql(`
              mutation($input: CreateCommitOnBranchInput!) {
                createCommitOnBranch(input: $input) { commit { oid } }
              }
            `, {
              input: {
                branch: { repositoryNameWithOwner: `${context.repo.owner}/${context.repo.repo}`, refName: 'master' },
                expectedHeadOid: context.sha,
                message: { headline: 'chore(release): update chart index' },
                fileChanges: { additions: [{ path: 'index.yaml', contents: contents.toString('base64') }] }
              }
            });
            await github.rest.repos.requestPagesBuild(context.repo);
