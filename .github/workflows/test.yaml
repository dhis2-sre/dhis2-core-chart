name: Test Chart

on:
  push:

jobs:
  test-chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Start k3s
        run: |
          cd tests/
          docker compose up -d
          for i in {1..40}; do
            if docker compose exec -T k3s kubectl get nodes >/dev/null 2>&1; then
              echo "k3s is ready"
              break
            fi
            echo "waiting for k3s..."
            sleep 5
          done

      # Validate the candidate seed image before its first registry publication.
      # Remove these two steps once dhis2/postgresql-curl:17-bookworm is released.
      - name: Check out seed image source
        uses: actions/checkout@v7
        with:
          repository: dhis2-sre/bitnami-postgresql-curl
          ref: 76ea03ea66b1d02327a2f8544f39c5b5a286adb0
          path: .seed-image

      - name: Load candidate seed image into k3s
        run: |
          docker build -f .seed-image/Dockerfile.seed -t dhis2/postgresql-curl:17-bookworm .seed-image
          docker save dhis2/postgresql-curl:17-bookworm | docker compose -f tests/docker-compose.yml exec -T k3s ctr -n k8s.io images import -

      - name: Set kubeconfig
        run: echo "KUBECONFIG=$PWD/tests/output/kubeconfig.yaml" >> $GITHUB_ENV

      - name: Get nodes
        run: kubectl get nodes

      - name: Install Helm and Sops
        uses: alexellis/arkade-get@master
        with:
          helm: v3.12.3
          sops: v3.7.3

      - name: Setup helm secrets plugin
        run: helm plugin install https://github.com/jkroepke/helm-secrets --version v4.6.5

      - name: Add helm repositories
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add selectdb https://charts.selectdb.com

      - name: Install CloudNativePG operator
        run: |
          helm repo add cnpg https://cloudnative-pg.github.io/charts
          helm upgrade --install cnpg cnpg/cloudnative-pg --namespace cnpg-system --create-namespace --wait

      - name: Install Skaffold
        run: |
          curl -fsSL "https://storage.googleapis.com/skaffold/releases/${VERSION}/skaffold-linux-amd64" -o /tmp/skaffold
          sudo install -m 0755 /tmp/skaffold /usr/local/bin/skaffold
        env:
          VERSION: v2.6.0

      - name: Deploy DHIS2 with FS
        run: |
          cd tests/fs/
          skaffold run --status-check --wait-for-deletions

      - name: Deploy DHIS2 with S3
        run: |
          cd tests/s3/
          skaffold run --status-check --wait-for-deletions

      - name: Deploy DHIS2 with MinIO via the dhis2 chart
        run: |
          cd tests/dhis2/
          skaffold run --status-check --wait-for-deletions

      - name: Verify endpoints
        env:
          ENDPOINTS: "http://dhis2-127-0-0-1.nip.io/fs http://dhis2-127-0-0-1.nip.io/s3 http://dhis2-127-0-0-1.nip.io/dhis2"
        run: |
          for url in $ENDPOINTS; do
            echo "🔍 Checking $url"
            success=false
            for i in {1..30}; do
              if curl --verbose --silent --fail --location "$url" > /dev/null; then
                echo "✅ $url is reachable"
                success=true
                break
              fi
              echo "waiting for $url..."
              sleep 5
            done
          
            if [ "$success" = false ]; then
              echo "❌ $url did not respond"
              exit 1
            fi
          done

      - name: Show Kubernetes diagnostics
        if: always()
        run: |
          kubectl get nodes -o wide
          kubectl get pods -o wide --all-namespaces
          kubectl get events --all-namespaces --sort-by=.lastTimestamp
          if [ "${{ job.status }}" != success ]; then
            kubectl describe pods --all-namespaces
            kubectl get pods --all-namespaces -o json | jq -r '.items[] | [.metadata.namespace, .metadata.name] | @tsv' |
              while read -r namespace pod; do
                kubectl logs -n "$namespace" "$pod" --all-containers --tail=80 --prefix || true
              done
          fi
