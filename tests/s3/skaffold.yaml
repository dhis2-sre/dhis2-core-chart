apiVersion: skaffold/v4beta6
kind: Config
deploy:
  statusCheckDeadlineSeconds: 420
  helm:
    # The database seed runs as a post-install hook helm waits for; the default 5m timeout is too
    # tight for the seed import on a busy runner.
    flags:
      install: ["--timeout", "15m0s"]
      upgrade: ["--timeout", "15m0s"]
    releases:
      # Standalone MinIO acting as the external S3 endpoint; the chart's own MinIO subchart is not
      # used here since this test exercises the storage.type=s3 path against an external service.
      - name: dhis2-s3-minio
        namespace: dhis2
        createNamespace: true
        remoteChart: minio
        repo: https://charts.bitnami.com/bitnami
        version: 14.7.5
        setValueTemplates:
          persistence:
            annotations:
              helm\.sh/resource-policy: keep
          auth:
            rootUser: dhisdhis
            rootPassword: dhisdhis
            forcePassword: true
          defaultBuckets: dhis2
          global:
            security:
              allowInsecureImages: true
          image:
            repository: bitnamilegacy/minio

      - name: dhis2-s3
        namespace: dhis2
        createNamespace: true
        chartPath: ../../charts/dhis2
        valuesFiles:
          - ../seed.yaml
          - ./values/dhis2.yaml
