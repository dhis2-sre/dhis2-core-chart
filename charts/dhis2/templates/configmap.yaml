{{- include "dhis2-core-helm.ssoValidate" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dhis2-core-helm.fullname" . }}
  labels:
    {{- include "dhis2-core-helm.labels" . | nindent 4 }}
data:
  dhis.conf: |
   {{- if .Values.customConfigSnippet }}
   {{- .Values.customConfigSnippet | nindent 4 }}
   {{- end }}
    connection.dialect = org.hibernate.dialect.PostgreSQLDialect
    connection.driver_class = org.postgresql.Driver
    connection.url = jdbc:postgresql://${DB_HOSTNAME}/${DB_DATABASE}
    connection.username = ${DB_USERNAME}
    connection.password = ${DB_PASSWORD}
    {{- if or .Values.sso.baseUrl .Values.ingress.enabled }}
    server.base.url = {{ include "dhis2-core-helm.ssoBaseUrl" . }}
    {{- end }}
    {{- if or .Values.ingress.enabled .Values.sso.baseUrl }}
    server.https = {{ if hasPrefix "https://" (include "dhis2-core-helm.ssoBaseUrl" .) }}true{{ else }}false{{ end }}
    {{- end }}
    session.cookie.samesite = {{ .Values.sessionCookieSameSite }}
    {{- if .Values.sso.authorizationServer.enabled }}
    oauth2.server.enabled = on
    oauth2.server.jwt.keystore.path = {{ .Values.dhis2Home }}/oauth2-signing.p12
    oauth2.server.jwt.keystore.password = ${SSO_KEYSTORE_PASSWORD}
    oauth2.server.jwt.keystore.alias = {{ .Values.sso.authorizationServer.keyAlias }}
    oauth2.server.jwt.keystore.key-password = ${SSO_KEY_PASSWORD}
    oauth2.server.jwt.keystore.generate-if-missing = false
    {{- end }}
    {{- range .Values.sso.oidc.providers }}
    oidc.provider.{{ .id }}.client_id = {{ .clientId }}
    oidc.provider.{{ .id }}.client_secret = ${SSO_OIDC_{{ .id | upper | replace "-" "_" }}_CLIENT_SECRET}
    oidc.provider.{{ .id }}.authorization_uri = {{ .authorizationUri }}
    oidc.provider.{{ .id }}.token_uri = {{ .tokenUri }}
    oidc.provider.{{ .id }}.user_info_uri = {{ .userInfoUri }}
    oidc.provider.{{ .id }}.jwk_uri = {{ .jwkUri }}
    {{- if .mappingClaim }}
    oidc.provider.{{ .id }}.mapping_claim = {{ .mappingClaim }}
    {{- end }}
    {{- if .scopes }}
    oidc.provider.{{ .id }}.scopes = {{ .scopes }}
    {{- end }}
    {{- if .displayAlias }}
    oidc.provider.{{ .id }}.display_alias = {{ .displayAlias }}
    {{- end }}
    {{- if .redirectUrl }}
    oidc.provider.{{ .id }}.redirect_url = {{ .redirectUrl }}
    {{- end }}
    {{- if .enableLogout }}
    oidc.provider.{{ .id }}.enable_logout = on
    {{- end }}
    {{- if .endSessionEndpoint }}
    oidc.provider.{{ .id }}.end_session_endpoint = {{ .endSessionEndpoint }}
    {{- end }}
    {{- if .enablePkce }}
    oidc.provider.{{ .id }}.enable_pkce = true
    {{- end }}
    {{- end }}
    {{- if eq (include "dhis2-core-helm.storageType" .) "minio" }}
    filestore.provider = ${MINIO_PROVIDER}
    filestore.container = ${MINIO_CONTAINER}
    filestore.endpoint = ${MINIO_ENDPOINT}
    filestore.location = ${MINIO_LOCATION}
    filestore.identity = ${MINIO_IDENTITY}
    filestore.secret = ${MINIO_SECRET}
    {{- end }}
    {{- if eq (include "dhis2-core-helm.storageType" .) "s3" }}
    filestore.provider = ${S3_PROVIDER}
    filestore.container = ${S3_CONTAINER}
    filestore.endpoint = ${S3_ENDPOINT}
    filestore.location = ${S3_LOCATION}
    filestore.identity = ${S3_IDENTITY}
    filestore.secret = ${S3_SECRET}
    {{- end }}
    flyway.migrate_out_of_order = ${FLYWAY_MIGRATE_OUT_OF_ORDER}
    flyway.repair_before_migration = ${FLYWAY_REPAIR_BEFORE_MIGRATION}
    enable.query.logging = ${ENABLE_QUERY_LOGGING}
    {{- if .Values.doris.enabled }}
    analytics.table.unlogged = on
    analytics.table.use_views = off
    analytics.database = doris
    analytics.database.driver_filename = {{ .Values.doris.driverFilename }}
    analytics.connection.url = jdbc:mysql://${DORIS_HOSTNAME}:${DORIS_PORT}/${DORIS_DATABASE}?useUnicode=true&characterEncoding=UTF-8&useSSL=${DORIS_USE_SSL}
    analytics.connection.username = ${DORIS_USERNAME}
    analytics.connection.password = ${DORIS_PASSWORD}
    {{- end }}
  log4j2.xml: |
    {{- .Files.Get .Values.log4j2 | nindent 4 }}
  server.xml: |
    {{- .Files.Get .Values.serverXml | nindent 4 }}
