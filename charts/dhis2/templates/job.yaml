---

{{- if and .Values.doris.enabled .Values.doris.createDatabase }}
{{- if not .Values.doris.database }}
{{- fail "doris.database is required when createDatabase is true" }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ include "dhis2-core-helm.fullname" . }}-create-doris-database"
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  ttlSecondsAfterFinished: 300
  activeDeadlineSeconds: 1200
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-doris-database
          image: mysql:8.0
          env:
{{- if .Values.doris.existingSecret }}
            - name: DORIS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.doris.existingSecret }}
                  key: {{ .Values.doris.secretKeys.username }}
            - name: DORIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.doris.existingSecret }}
                  key: {{ .Values.doris.secretKeys.password }}
{{- else }}
            - name: DORIS_USERNAME
              value: {{ .Values.doris.username | quote }}
            - name: DORIS_PASSWORD
              value: {{ .Values.doris.password | quote }}
{{- end }}
          # ADMIN_PRIV because DHIS 2 creates a JDBC catalog against the PostgreSQL database on startup.
          command:
            - /bin/sh
            - -c
            - |
              set -e
              until mysql -h {{ include "dhis2-core-helm.dorisHostname" . }} -P {{ .Values.doris.port }} -uroot -e "CREATE DATABASE IF NOT EXISTS {{ .Values.doris.database }}"; do
                echo "Doris is not ready yet, retrying in 10s"
                sleep 10
              done
              mysql -h {{ include "dhis2-core-helm.dorisHostname" . }} -P {{ .Values.doris.port }} -uroot -e "CREATE USER IF NOT EXISTS '${DORIS_USERNAME}'@'%' IDENTIFIED BY '${DORIS_PASSWORD}'"
              mysql -h {{ include "dhis2-core-helm.dorisHostname" . }} -P {{ .Values.doris.port }} -uroot -e "GRANT ADMIN_PRIV ON *.*.* TO '${DORIS_USERNAME}'@'%'"

---

apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ include "dhis2-core-helm.fullname" . }}-drop-doris-database"
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: drop-doris-database
          image: mysql:8.0
          # Best effort: an unreachable Doris must not block uninstall, and the analytics database
          # is derived data that can be regenerated.
          command:
            - /bin/sh
            - -c
            - |
              for i in $(seq 1 12); do
                if mysql -h {{ include "dhis2-core-helm.dorisHostname" . }} -P {{ .Values.doris.port }} -uroot -e "DROP DATABASE IF EXISTS {{ .Values.doris.database }}"; then
                  exit 0
                fi
                echo "Doris is not reachable, retrying in 5s"
                sleep 5
              done
              echo "Could not drop database {{ .Values.doris.database }}, continuing with uninstall"
{{- end }}
